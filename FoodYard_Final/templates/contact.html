{% extends "base.html" %}
{% block title %}Contact FoodYard{% endblock %}
{% block content %}
<section class="form-page"><div class="container narrow">
    <div class="page-intro"><div class="eyebrow">CONTACT US</div><h1>Have a question?</h1><p>Send a message to the FoodYard team. Administrators can review messages from their dashboard.</p></div>
    <div class="panel contact-panel">
        <form method="POST" class="form">
            <div class="form-row"><label>Name<input type="text" name="name" required></label><label>Email<input type="email" name="email" required></label></div>
            <label>Message<textarea name="message" rows="7" placeholder="Write your message..." required></textarea></label>
            <button class="btn btn-primary" type="submit">Send Message →</button>
        </form>
    </div>
</div></section>
{% endblock %}
